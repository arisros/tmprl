[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.2"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/arisros/tmprl"
homepage = "https://github.com/arisros/tmprl"
keywords = ["temporal", "tui", "terminal", "workflow"]
categories = ["command-line-utilities"]

[workspace.dependencies]
tmprl-core = { path = "crates/tmprl-core", version = "0.4.2" }
tmprl-client = { path = "crates/tmprl-client", version = "0.4.2" }
tmprl-ui = { path = "crates/tmprl-ui", version = "0.4.2" }
# `vendored-protox`: `cargo install` needs no system `protoc`.
temporalio-client = { version = "=1.0.0", features = ["vendored-protox"] }
temporalio-common = { version = "=1.0.0", features = ["vendored-protox"] }
# temporalio-protos generates against prost-wkt-types and re-exports neither.
prost-wkt-types = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "process", "io-util"] }
ratatui = "0.30"
# event-stream for the async EventStream, osc52 for clipboard writes over SSH.
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
futures-util = "0.3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
thiserror = "2"
toml = "0.9"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
base64 = "0.22"
jiff = "0.2"
uuid = { version = "1", features = ["v4"] }

# No debug info by default; use `--profile dbg` for a debugger.
[profile.dev]
debug = false
incremental = true

[profile.dbg]
inherits = "dev"
debug = true

[profile.dist]
inherits = "release"
lto = "thin"
