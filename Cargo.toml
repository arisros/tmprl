[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/arisjirat/tmprl"

[workspace.dependencies]
temporalio-client = "=0.7.0"
temporalio-common = "=0.7.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
ratatui = "0.30"
# ratatui pulls crossterm but not these two features: `event-stream` gives the async
# EventStream the select! loop needs, `osc52` gives clipboard writes that survive SSH.
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
futures-util = "0.3"
anyhow = "1"
tracing = "0.1"
thiserror = "2"

# Debug info for 227 crates (temporalio-protos especially) does not fit in the
# 4.6G free on this box. Keep dev builds lean; use `--profile dbg` when a real
# debugger is actually needed.
[profile.dev]
debug = false
incremental = false

[profile.dbg]
inherits = "dev"
debug = true
