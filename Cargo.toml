[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1-rc.3"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/arisros/tmprl"
homepage = "https://github.com/arisros/tmprl"
keywords = ["temporal", "tui", "terminal", "workflow"]
categories = ["command-line-utilities"]

[workspace.dependencies]
# The workspace's own crates. The version is what crates.io resolves them by once
# published; the path is what a local build uses. Bump both with workspace.package.
tmprl-core = { path = "crates/tmprl-core", version = "0.1.1-rc.3" }
tmprl-client = { path = "crates/tmprl-client", version = "0.1.1-rc.3" }
tmprl-ui = { path = "crates/tmprl-ui", version = "0.1.1-rc.3" }
temporalio-client = "=0.7.0"
temporalio-common = "=0.7.0"
# Timestamps on the generated protos are `prost_wkt_types::Timestamp`, NOT
# `prost_types::Timestamp`, temporalio-protos generates against prost-wkt-types and
# re-exports neither. Mapping a start time to epoch millis needs this crate by name.
prost-wkt-types = "0.7"
# "process" is for `!`, filtering a payload through an external command such as jq.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "process", "io-util"] }
ratatui = "0.30"
# ratatui pulls crossterm but not these two features: `event-stream` gives the async
# EventStream the select! loop needs, `osc52` gives clipboard writes that survive SSH.
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
futures-util = "0.3"
anyhow = "1"
tracing = "0.1"
thiserror = "2"
# keys.toml / views.toml parsing. Pure string -> struct, so it lives in tmprl-core;
# reading the files is the TUI's job.
toml = "0.9"
# Payload rendering: pretty-printing a json/plain payload, and deciding whether one is
# valid JSON before it is piped anywhere. Parsing only, no derives.
serde_json = "1"
# The codec-server round trip is plain HTTP(S), not gRPC. rustls rather than native-tls
# because temporalio-client already brings rustls in, so this shares its stack.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
base64 = "0.22"
# Wall-clock rendering. Temporal reports every timestamp as UTC epoch millis, and a
# timezone is not something std can convert to: jiff carries the tz database and reads the
# system zone, which is what turns "5m ago" into a time an operator can quote.
jiff = "0.2"
# Request ids. Reset requires one (the server rejects the call without it), and giving every
# mutation a fresh one makes a retried request idempotent rather than doubled.
uuid = { version = "1", features = ["v4"] }

# Debug info for 227 crates (temporalio-protos especially) is large enough to be
# worth not carrying: `target` lives on a 184G volume now, so this is about build
# time rather than space. Use `--profile dbg` when a debugger is actually needed.
#
# `incremental` stays on: without it every edit recompiles all four workspace
# crates, which is the whole edit-test loop paying for a full build.
[profile.dev]
debug = false
incremental = true

[profile.dbg]
inherits = "dev"
debug = true

# The profile release binaries are built with (dist build, release.yml).
[profile.dist]
inherits = "release"
lto = "thin"
