name: Prepare release

# Step one of a release, from the Actions tab: bump the version, write the changelog
# section, open a PR. Merging that PR is what makes the version real; step two is the
# Release workflow, which takes the tag.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      channel:
        description: A release candidate, or the real thing
        required: true
        default: release
        type: choice
        options: [release, rc]

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags decide the next rc number, and the changelog reads the log since the last one.
          fetch-depth: 0

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - id: bump
        run: echo "version=$(scripts/prepare-release.sh '${{ inputs.bump }}' '${{ inputs.channel }}')" >> "$GITHUB_OUTPUT"

      - name: Open the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="release/v$VERSION"
          git switch -c "$branch"
          git commit -am "chore(release): v$VERSION"
          # Re-running this job after it failed later on must replace its own half-finished
          # branch rather than be rejected as a non-fast-forward. The fetch is what makes
          # --force-with-lease meaningful: without a remote-tracking ref it has no lease to
          # check, and would refuse on stale info.
          git fetch origin "$branch" || true
          git push --force-with-lease -u origin "$branch"

          # The section this bump just wrote: from its heading to the one before it.
          {
            echo "Prepared by the Prepare release workflow."
            echo
            echo "After merging, run **Actions -> Release -> Run workflow** with the tag \`v$VERSION\`."
            echo
            awk '/^## /{n++} n==1' CHANGELOG.md
          } > /tmp/pr-body.md

          # A re-run finds the PR the earlier attempt opened; creating a second one fails.
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$branch" --body-file /tmp/pr-body.md
          else
            gh pr create --base main --title "chore(release): v$VERSION" --body-file /tmp/pr-body.md
          fi
