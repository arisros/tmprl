name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: scripts/check-docs.sh
      - run: cargo clippy --all-targets --all-features
      - run: cargo build --all-targets

  # Keep equal to rust-version in Cargo.toml.
  msrv:
    name: msrv (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - uses: Swatinem/rust-cache@v2

      - run: cargo check --all-targets --all-features --locked

  macos:
    name: macOS · build · tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --all-features

  # Each entry must be a temporalio/cli tag; the CLI version picks the server version.
  test:
    name: tests (live server, temporal CLI ${{ matrix.temporal-cli }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        temporal-cli: [latest, v1.5.1]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install Temporal CLI
        run: |
          curl -sSfL "https://temporal.download/cli/archive/${{ matrix.temporal-cli }}?platform=linux&arch=amd64" \
            -o /tmp/temporal.tar.gz
          mkdir -p /tmp/tcli && tar -xzf /tmp/temporal.tar.gz -C /tmp/tcli
          sudo install -m755 /tmp/tcli/temporal /usr/local/bin/temporal
          temporal --version

      - name: Start dev server
        run: |
          nohup temporal server start-dev --ip 127.0.0.1 --port 7233 --log-level warn \
            > /tmp/temporal-dev.log 2>&1 &
          for i in $(seq 1 30); do
            temporal operator namespace list --address 127.0.0.1:7233 >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "dev server never came up"; cat /tmp/temporal-dev.log; exit 1

      - name: Seed workflows
        run: |
          for i in 1 2 3; do
            temporal workflow start --address 127.0.0.1:7233 \
              --task-queue ci --type CiWorkflow --workflow-id "ci-$i"
          done

      - name: Test
        env:
          TEMPORAL_ADDRESS: 127.0.0.1:7233
          TMPRL_REQUIRE_SERVER: "1"
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - uses: codecov/codecov-action@v5
        if: matrix.temporal-cli == 'latest'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
